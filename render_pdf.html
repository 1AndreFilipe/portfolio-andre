<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Renderer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #08090c; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        canvas { max-width: 100%; height: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        async function renderPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument('file:///C:/Users/andre/Downloads/Email.pdf');
                const pdf = await loadingTask.promise;
                console.log('PDF loaded, total pages:', pdf.numPages);
                
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 2.0 });
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                document.getElementById('container').appendChild(canvas);

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;
                console.log('Page 1 rendered successfully!');
                document.title = 'READY_TO_SCREENSHOT';
            } catch (err) {
                console.error('Error loading PDF:', err);
            }
        }
        renderPDF();
    </script>
</body>
</html>
